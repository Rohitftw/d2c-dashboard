:root{--bg:#0e1118;--side:#131722;--card:#171b26;--line:#252b3b;--tx:#e8ebf3;--mu:#8b93a7;--ac:#7c8cff;--gold:#e6b422;--silver:#b8c0cc;--bronze:#cd7f32;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.side{position:fixed;inset:0 auto 0 0;width:260px;background:var(--side);border-right:1px solid var(--line);padding:20px 16px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--ac),#34d3a8);display:grid;place-items:center;font-weight:700;color:#0b0e16}
.brand b{display:block;font-size:15px}.brand span{font-size:11px;color:var(--mu);line-height:1.3;display:block}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
select{width:100%;font:inherit;font-size:13px;color:var(--tx);background:#0f131c;border:1px solid var(--line);border-radius:8px;padding:7px 8px}
select[multiple]{padding:4px}select[multiple] option{padding:3px 6px;border-radius:4px}
select[multiple] option:checked{background:var(--ac) linear-gradient(0deg,var(--ac),var(--ac));color:#0b0e16}
.hint{font-size:11px;color:var(--mu);margin-top:4px}
.range{display:flex;gap:8px}
#reset{width:100%;font:inherit;font-weight:600;color:#0b0e16;background:var(--ac);border:0;border-radius:8px;padding:10px;cursor:pointer}
#reset:hover{filter:brightness(1.1)}
#showing{margin-top:10px;font-size:12px;color:var(--mu);text-align:center}
.main{margin-left:260px;padding:22px 24px 48px;max-width:1500px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--mu);margin:0}
.badges{display:flex;gap:6px}.badge{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mu);background:var(--card);white-space:nowrap}
h2{font-size:15px;margin:32px 0 12px;display:flex;align-items:center;gap:8px}
h2 small{color:var(--mu);font-weight:400;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}
.kpi{position:relative;overflow:hidden;padding-top:17px}
.kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--k)}
.kpi .ic{position:absolute;top:14px;right:14px;width:22px;height:22px;color:var(--k);opacity:.4}
.kpi .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.kpi .v{font-size:24px;font-weight:700;margin:2px 0}.kpi .c{font-size:11px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}
.ch h3{font-size:13px;margin:0;font-weight:600}.ch span{font-size:11px;color:var(--mu);white-space:nowrap}
.cv{position:relative;height:260px}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--mu)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.notice{background:#3a2a12;border:1px solid #6b4a15;color:#ffcf85;border-radius:10px;padding:10px 14px;margin-top:16px}
.cnt{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--ac);color:#0b0e16}
.tw{overflow-x:auto;max-height:460px;overflow-y:auto;padding:0}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#1d2231;color:var(--mu);font-weight:500}
td.n,th.n{text-align:right}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid}
.pill.gold{color:var(--gold);border-color:var(--gold);background:#e6b42218}
.pill.silver{color:var(--silver);border-color:var(--silver);background:#b8c0cc18}
.pill.bronze{color:var(--bronze);border-color:var(--bronze);background:#cd7f3218}
.empty{color:var(--mu);text-align:center;padding:20px}
@media(max-width:900px){.side{position:static;width:auto;border-right:0;border-bottom:1px solid var(--line)}.main{margin-left:0;padding:18px 14px 40px}}
</style>
</head>

// ---------- filter state + the ONE filter function ----------
const state = {channel:new Set(), category:new Set(), product:'', segment:'', from:MONTHS[0], to:MONTHS[MONTHS.length-1]};
function applyFilters(rows, s) {
  const lo = s.from <= s.to ? s.from : s.to, hi = s.from <= s.to ? s.to : s.from;
  return rows.filter(r =>
    (!s.channel.size || s.channel.has(r.channel)) &&
    (!s.category.size || s.category.has(r.category)) &&
    (!s.product || r.product_name === s.product) &&
    (!s.segment || r.customer_segment === s.segment) &&
    monthOf(r) >= lo && monthOf(r) <= hi);
}

// ---------- aggregation (shared by all charts) ----------
function group(rows, key) {
  const m = {};
  rows.forEach(r => {
    const g = m[r[key]] ||= {k:r[key], rev:0, ord:0, units:0, disc:0};
    g.rev += r.revenue; g.ord++; g.units += r.quantity; g.disc += r.discount_pct;
  });
  return Object.values(m).map(g => ({...g, avgDisc:g.disc/g.ord, aov:g.rev/g.ord}));
}

// ---------- chart specs ----------
const P = ['#7c8cff','#34d3a8','#ffb454','#ff6b8b','#4cc9f0','#b48cff','#9ad35a','#f08a5d','#5ea8ff','#e0a3ff'];
const SPECS = [
  {sec:'Channel', by:'channel', title:'Revenue by channel', v:'rev', f:inr, c:P[0]},
  {sec:'Channel', by:'channel', title:'Revenue share', v:'rev', f:inr, type:'doughnut'},
  {sec:'Channel', by:'channel', title:'Orders by channel', v:'ord', f:int, c:P[1]},
  {sec:'Channel', by:'channel', title:'Avg discount % by channel', v:'avgDisc', f:pct, c:P[2]},
  {sec:'Product (top 10 by revenue)', by:'product_name', title:'Revenue', v:'rev', f:inr, c:P[0], top:10, h:1},
  {sec:'Product (top 10 by revenue)', by:'product_name', title:'Units sold', v:'units', f:int, c:P[1], top:10, h:1},
  {sec:'Product (top 10 by revenue)', by:'product_name', title:'Orders', v:'ord', f:int, c:P[4], top:10, h:1},
  {sec:'Product (top 10 by revenue)', by:'product_name', title:'Avg discount %', v:'avgDisc', f:pct, c:P[2], top:10, h:1},
  {sec:'Category', by:'category', title:'Revenue by category', v:'rev', f:inr, c:P[0]},
  {sec:'Category', by:'category', title:'Orders by category', v:'ord', f:int, c:P[1]},
  {sec:'Category', by:'category', title:'Avg order value by category', v:'aov', f:inr, c:P[3]}
];

// ---------- shared color maps (one color per category, identical on every chart) ----------
const CHANNEL_COLORS  = {App:'#7c8cff', Amazon:'#ffb454', Instagram:'#ff6b8b', Website:'#34d3a8', WhatsApp:'#4cc9f0'};
const CATEGORY_COLORS = {Haircare:'#9ad35a', Makeup:'#e0a3ff', Skincare:'#f08a5d', Wellness:'#5ea8ff'};
const PRODUCT_COLORS  = {};   // stable per product: alphabetical position, spread around the hue wheel
uniq(r => r.product_name).forEach((p, i) => PRODUCT_COLORS[p] = `hsl(${Math.round(i * 137.5) % 360} 65% 62%)`);
const COLOR_MAPS = {channel:CHANNEL_COLORS, category:CATEGORY_COLORS, product_name:PRODUCT_COLORS};
const colorFor = (by, k) => (COLOR_MAPS[by] || {})[k] || '#8b93a7';

const hasChart = typeof Chart !== 'undefined';
const NOTES = ['Net revenue (₹)','Share of net revenue','Count of order rows','Mean of order discount %',
  'Net revenue (₹)','Units (sum of quantity)','Count of order rows','Mean of order discount %',
  'Net revenue (₹)','Count of order rows','Revenue ÷ orders (₹)'];
const SECS = {'Channel':['📡','Channel Analysis',''], 'Product (top 10 by revenue)':['🛍️','Product Analysis','Top 10 by revenue'], 'Category':['🗂️','Category Analysis','']};

function buildChartShells() {
  if (!hasChart) {
    $('#notice').innerHTML = '<div class="notice">Charts could not load (Chart.js unavailable, possibly offline). KPIs and the data table below still work.</div>';
    return;
  }
  Chart.defaults.color = '#8b93a7';
  Chart.defaults.borderColor = '#252b3b';
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
  let last = '', grid = null;
  SPECS.forEach((s, i) => {
    if (s.sec !== last) {
      last = s.sec;
      const [ic, name, note] = SECS[s.sec];
      const h = document.createElement('h2'); h.textContent = ic + ' ' + name;
      if (note) { const sm = document.createElement('small'); sm.textContent = note; h.append(sm); }
      $('#charts').append(h);
      grid = document.createElement('div'); grid.className = 'grid'; $('#charts').append(grid);
    }
    const card = document.createElement('div'); card.className = 'card';
    const hd = document.createElement('div'); hd.className = 'ch';
    const t = document.createElement('h3'); t.textContent = s.title;
    const nt = document.createElement('span'); nt.textContent = NOTES[i];
    hd.append(t, nt);
    const cv = document.createElement('div'); cv.className = 'cv';
    const c = document.createElement('canvas'); cv.append(c); card.append(hd, cv);
    if (s.by === 'channel' && !s.type) {   // color key under each channel bar chart
      const lg = document.createElement('div'); lg.className = 'leg';
      Object.entries(CHANNEL_COLORS).forEach(([k, col]) => {
        const it = document.createElement('span'), dot = document.createElement('i');
        dot.style.background = col; it.append(dot, k); lg.append(it);
      });
      card.append(lg);
    }
    grid.append(card);
    const dough = s.type === 'doughnut';
    const ax = {ticks:{callback:v => axisFmt(s.f, v)}, beginAtZero:true, grid:{color:'#252b3b'}}, cat = {grid:{display:false}};
    s.chart = new Chart(c, {
      type: dough ? 'doughnut' : 'bar',
      data: {labels:[], datasets:[{data:[], backgroundColor: [], borderWidth:0, borderRadius: dough ? 0 : 4}]},
      options: {
        indexAxis: s.h ? 'y' : 'x', responsive:true, maintainAspectRatio:false,
        plugins: {legend:{display:dough, position:'bottom'}, tooltip:{callbacks:{label: x => ' ' + s.f(dough ? x.raw : x.parsed[s.h ? 'x' : 'y'])}}},
        scales: dough ? {} : (s.h ? {x:ax, y:cat} : {x:cat, y:ax})
      }
    });
  });
}

function renderCharts(rows) {
  if (!hasChart) return;
  const cache = {};
  SPECS.forEach(s => {
    const g = cache[s.by] ||= group(rows, s.by);
    const sorted = [...g].sort((a, b) => s.top ? b.rev - a.rev : b[s.v] - a[s.v]).slice(0, s.top || 99);
    s.chart.data.labels = sorted.map(x => x.k);
    s.chart.data.datasets[0].data = sorted.map(x => x[s.v]);
    s.chart.data.datasets[0].backgroundColor = sorted.map(x => colorFor(s.by, x.k));
    s.chart.update();
  });
}

function renderKpis(rows) {
  const rev = rows.reduce((a, r) => a + r.revenue, 0), n = rows.length;
  const IC = {   // static, trusted SVG paths
    rev:'<path d="M6 4h12M6 9h12M9 4c6 0 6 5 0 5l6 11"/>',
    ord:'<path d="M6 7h12l1 13H5L6 7zM9 7a3 3 0 0 1 6 0"/>',
    aov:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3zM9 8h6M9 12h6"/>',
    units:'<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/>',
    disc:'<path d="M20 12l-8 8-9-9V3h8l9 9zM7.5 7.5h.01"/>'};
  const items = [
    ['Total Revenue', inr(rev), 'Net after channel discounts', '#34d3a8', 'rev'],
    ['Total Orders', int(n), 'Count of order rows', '#5ea8ff', 'ord'],
    ['Avg Order Value', n ? inr(rev / n) : '—', 'Revenue ÷ Orders', '#ffb454', 'aov'],
    ['Units Sold', int(rows.reduce((a, r) => a + r.quantity, 0)), 'Sum of quantity', '#b48cff', 'units'],
    ['Avg Discount', n ? pct(rows.reduce((a, r) => a + r.discount_pct, 0) / n) : '—', 'Mean discount % per order', '#ff6b8b', 'disc']
  ];
  $('#kpis').innerHTML = items.map(([l, v, c, k, i]) => `<div class="card kpi" style="--k:${k}"><span class="ic"><svg viewBox="0 0 24 24">${IC[i]}</svg></span><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div><div class="c">${esc(c)}</div></div>`).join('');
  const t = `Showing ${n} of ${ANALYTICS_DATA.length} orders`;
  $('#showing').textContent = t; $('#tcnt').textContent = n + ' rows';
}

const SEG = {Gold:'gold', Silver:'silver', Bronze:'bronze'};
const COLS = [['order_id','Order'],['order_date','Date'],['customer','Customer'],['customer_segment','Segment'],['city','City'],['category','Category'],['product_name','Product'],['channel','Channel'],['quantity','Qty',1],['MRP','MRP',1],['discount_pct','Disc %',1],['revenue','Revenue',1]];
function cell(r, k) {
  if (k === 'customer') return esc(CUSTOMER_NAMES[r.customer_id] || r.customer_id);
  if (k === 'customer_segment') return `<span class="pill ${SEG[r[k]] || ''}">${esc(r[k])}</span>`;
  if (k === 'revenue' || k === 'MRP') return esc(inr(r[k]));
  if (k === 'discount_pct') return esc(pct(r[k]));
  return esc(r[k]);
}
function renderTable(rows) {
  $('#thead').innerHTML = '<tr>' + COLS.map(c => `<th class="${c[2] ? 'n' : ''}">${esc(c[1])}</th>`).join('') + '</tr>';
  const sorted = [...rows].sort((a, b) => b.order_date.localeCompare(a.order_date));
  $('#tbody').innerHTML = sorted.length
    ? sorted.map(r => '<tr>' + COLS.map(c => `<td class="${c[2] ? 'n' : ''}">${cell(r, c[0])}</td>`).join('') + '</tr>').join('')
    : `<tr><td class="empty" colspan="${COLS.length}">No orders match the current filters.</td></tr>`;
}

function render() {
  const rows = applyFilters(ANALYTICS_DATA, state);   // single source for everything
  renderKpis(rows); renderCharts(rows); renderTable(rows);
}

// ---------- filter UI ----------
function fillSelect(id, opts) {   // opts: [value, label]
  $('#f-' + id).innerHTML = opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
}
function initFilters() {
  const ch = uniq(r => r.channel), ca = uniq(r => r.category);
  fillSelect('channel', ch.map(v => [v, v])); fillSelect('category', ca.map(v => [v, v]));
  $('#f-channel').size = ch.length; $('#f-category').size = ca.length;
  fillSelect('product', [['', 'All products'], ...uniq(r => r.product_name).map(p => [p, p])]);
  fillSelect('segment', [['', 'All'], ['Gold','Gold'], ['Silver','Silver'], ['Bronze','Bronze']]);
  const mo = MONTHS.map(m => [m, monLabel(m)]);
  fillSelect('from', mo); fillSelect('to', mo);
  ['channel','category'].forEach(k => $('#f-' + k).onchange = e => { state[k] = new Set([...e.target.selectedOptions].map(o => o.value)); render(); });
  ['product','segment','from','to'].forEach(k => $('#f-' + k).onchange = e => { state[k] = e.target.value; render(); });
  $('#reset').onclick = resetFilters;
  const n = k => new Set(ANALYTICS_DATA.map(r => r[k])).size;
  $('#dsub').textContent = `FY ${MONTHS[0].slice(0,4)} · ${ANALYTICS_DATA.length} Orders · ${n('product_name')} Products · ${n('category')} Categories · ${n('channel')} Channels`;
  resetFilters();
}
function resetFilters() {
  Object.assign(state, {product:'', segment:'', from:MONTHS[0], to:MONTHS[MONTHS.length-1]});
  state.channel = new Set(); state.category = new Set();
  ['channel','category'].forEach(k => [...$('#f-' + k).options].forEach(o => o.selected = false));
  ['product','segment','from','to'].forEach(k => $('#f-' + k).value = state[k]);
  render();
}

buildChartShells();
initFilters();
</script>
</body>
</html>
